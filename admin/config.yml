backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Global"
        name: "global"
        format: "json"
        fields:
          - { label: "Brand Name", name: "brandName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Contact Name", name: "contactName", widget: "string", required: false }
          - { label: "WhatsApp", name: "contactWhatsapp", widget: "string", required: false }
          - { label: "Email", name: "contactEmail", widget: "string", required: false }
          - { label: "IG", name: "contactIg", widget: "string", required: false }

  - name: "market"
    label: "Market Chapter"
    files:
      - file: "content/market.json"
        label: "Market"
        name: "market"
        format: "json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }

  - name: "stress"
    label: "Stress Test"
    files:
      - file: "content/stress.json"
        label: "Stress"
        name: "stress"
        format: "json"
        fields:
          - { label: "Average Rental", name: "avgRental", widget: "number", value_type: "int" }
          - { label: "Monthly Burn", name: "burn", widget: "number", value_type: "int" }
          - { label: "Capital Buffer", name: "capital", widget: "number", value_type: "int" }
          - { label: "Default Bookings", name: "defaultBookings", widget: "number", value_type: "int" }
