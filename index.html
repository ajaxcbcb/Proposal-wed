<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Bridal Rental Studio – Single Scroll Pitch</title>

<style>
:root{
  /* Bridal luxe palette */
  --bg0:#070812;
  --bg1:#0a1030;
  --ink:#f3edff;
  --muted:rgba(243,237,255,.72);

  --blush:#ffb7c8;
  --champ:#ffd9a6;
  --lilac:#c7b3ff;
  --aqua:#7de6ff;

  --good:#34d399;
  --warn:#fbbf24;
  --bad:#fb7185;

  --soft:rgba(255,255,255,.08);
  --soft2:rgba(255,255,255,.14);

  --radius:18px;
  --shadow:0 20px 55px rgba(0,0,0,.45);
  --shadow2:0 10px 28px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  color:var(--ink);
  background:
    radial-gradient(900px 650px at 20% 10%, rgba(199,179,255,.18), transparent 58%),
    radial-gradient(900px 650px at 78% 18%, rgba(125,230,255,.14), transparent 55%),
    radial-gradient(900px 650px at 50% 88%, rgba(255,183,200,.10), transparent 55%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  overflow-x:hidden;
}

/* Subtle shimmering lattice (bridal lace vibe) */
.lace{
  position:fixed; inset:0;
  pointer-events:none;
  opacity:.28;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 45%),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,.08), transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(255,255,255,.07), transparent 55%),
    linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: auto, auto, auto, 64px 64px, 64px 64px;
  animation: laceDrift 14s ease-in-out infinite alternate;
}
@keyframes laceDrift{
  from{ transform: translate3d(-10px,-8px,0) scale(1.02)}
  to  { transform: translate3d(12px,10px,0) scale(1.05)}
}

/* Floating bokeh */
.bokeh{
  position:fixed; inset:-10%;
  pointer-events:none;
  opacity:.5;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,183,200,.20), transparent 22%),
    radial-gradient(circle at 25% 65%, rgba(255,217,166,.14), transparent 26%),
    radial-gradient(circle at 78% 22%, rgba(199,179,255,.18), transparent 24%),
    radial-gradient(circle at 85% 75%, rgba(125,230,255,.12), transparent 28%);
  animation: bokehFloat 18s ease-in-out infinite alternate;
}
@keyframes bokehFloat{
  from{ transform: translate3d(0,0,0) scale(1.0)}
  to  { transform: translate3d(0,-16px,0) scale(1.03)}
}

/* Glow follows pointer lightly */
.glow{
  position:fixed;
  width:520px; height:520px;
  left:0; top:0;
  transform: translate(-50%,-50%);
  background: radial-gradient(circle at 50% 50%,
    rgba(255,183,200,.20),
    rgba(199,179,255,.16),
    rgba(125,230,255,.10),
    transparent 62%);
  filter: blur(10px);
  opacity:.9;
  pointer-events:none;
  mix-blend-mode: screen;
}

/* Header */
header{
  position:sticky;
  top:0;
  z-index:50;
  padding: env(safe-area-inset-top) 14px 10px;
  backdrop-filter: blur(10px);
  background: linear-gradient(180deg, rgba(7,8,18,.88), rgba(7,8,18,.34));
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.topbar{
  max-width:980px;
  margin:0 auto;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  box-shadow: var(--shadow2);
  min-width:0;
}
.mark{
  width:34px; height:34px;
  border-radius:14px;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.38), transparent 55%),
    linear-gradient(135deg, var(--blush), var(--lilac), var(--aqua));
}
.brand .t{min-width:0}
.brand strong{display:block;font-size:14px;letter-spacing:.2px;white-space:nowrap}
.brand span{
  display:block;
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width: 56vw;
  margin-top:2px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: rgba(243,237,255,.80);
  font-size:12px;
  font-weight:750;
}

.progress{
  max-width:980px;
  margin:10px auto 0;
  height:6px;
  border-radius:999px;
  background: rgba(255,255,255,.08);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
}
.progress > div{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, var(--blush), var(--champ), var(--lilac), var(--aqua));
  border-radius:999px;
  transition: width .35s cubic-bezier(.2,.9,.2,1);
}

/* Sections */
section{
  padding:22px 14px;
}
.container{
  max-width:980px;
  margin:0 auto;
}

.card{
  border-radius: var(--radius);
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  padding:18px;
}

.kicker{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  font-size:12px;
  color: rgba(243,237,255,.82);
}
.dot{width:10px;height:10px;border-radius:999px;background: linear-gradient(135deg,var(--blush),var(--lilac),var(--aqua));}

h1{
  margin:0 0 10px;
  font-size: clamp(28px, 6.8vw, 46px);
  line-height:1.08;
  letter-spacing:-0.6px;
}
h2{
  margin:0 0 8px;
  font-size: clamp(20px, 5.5vw, 32px);
  letter-spacing:-0.25px;
}
h3{
